name: 'Upload Resource'
description: 'Upload a build artifact to the Resource Repository (POST /api/v1/resources)'
branding:
  icon: 'upload-cloud'
  color: 'blue'

inputs:
  file:
    description: 'Path of the file to upload, or several paths one per line. The last path segment may use * wildcards. All files upload into the same batch.'
    required: true
  filename:
    description: 'Optional filename to upload the file as, overriding the local file name. Only allowed when file names a single file.'
    required: false
  batch-name:
    description: 'Batch to upload into (trimmed, at most 128 characters). Defaults to <repo name>-<UTC date YYYY-MM-DD>-<resource type>, so every run in a repo on the same UTC day shares one batch per type.'
    required: false
  resource-type:
    description: 'Resource type (resourceType field)'
    required: true
  version:
    description: 'Optional resource version'
    required: false
  metadata:
    description: 'Optional metadata as a JSON string'
    required: false
  release-action:
    description: 'Optional release action: reject, feature_flag, or feature_flag_variation. "release" (immediate production release) is blocked — promote via the admin UI instead.'
    required: false
  flag:
    description: 'Feature flag name. Required when release-action is feature_flag or feature_flag_variation.'
    required: false
  provider:
    description: 'Feature flag provider (e.g. launchdarkly, split). Required when release-action is feature_flag or feature_flag_variation.'
    required: false
  project:
    description: 'Optional provider project identifier, scoping flag targeting rules'
    required: false
  api-base-url:
    description: 'Base URL of the Resource Repository API'
    required: true
  client-id:
    description: 'OIDC client ID for the client-credentials grant this action exchanges for a bearer token before upload.'
    required: true
  client-secret:
    description: 'OIDC client secret. Pass via secrets — never hardcode.'
    required: true
  token-url:
    description: 'OIDC token endpoint to exchange client-id/client-secret at. Defaults to the shared ADI realm used by all environments — override only if your client lives in a different realm.'
    required: false
    default: 'https://identity.snapone.com/realms/ADI/protocol/openid-connect/token'
  retries:
    description: 'Retry attempts for transient network/5xx failures'
    required: false
    default: '3'

outputs:
  resource-id:
    description: 'ID of the created resource (the first file, when several upload)'
  resource-version:
    description: 'Version of the created resource (the first file)'
  response:
    description: 'Full JSON response body from the API (the first file)'
  batch-id:
    description: 'ID of the batch the files joined'
  batch-name:
    description: 'Name of the batch the files joined'
  resource-ids:
    description: 'JSON array of the created resource IDs, in upload order'
  responses:
    description: 'JSON array of the response bodies, in upload order'
  sha256:
    description: 'Hex SHA-256 of the uploaded file (the first file)'

runs:
  using: node20
  main: scripts/upload.js
