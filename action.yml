name: 'Upload Resource'
description: 'Upload a build artifact to the Resource Repository (POST /api/v1/resources)'
branding:
  icon: 'upload-cloud'
  color: 'blue'

inputs:
  file:
    description: 'Path to the file to upload'
    required: true
  resource-type:
    description: 'Resource type (resourceType field)'
    required: true
  version:
    description: 'Optional resource version'
    required: false
  metadata:
    description: 'Optional metadata as a JSON string'
    required: false
  release-action:
    description: 'Optional release action: reject, feature_flag, or feature_flag_variation. "release" (immediate production release) is blocked — promote via the admin UI instead.'
    required: false
  flag:
    description: 'Feature flag name. Required when release-action is feature_flag or feature_flag_variation.'
    required: false
  provider:
    description: 'Feature flag provider (e.g. launchdarkly, split). Required when release-action is feature_flag or feature_flag_variation.'
    required: false
  project:
    description: 'Optional provider project identifier, scoping flag targeting rules'
    required: false
  api-base-url:
    description: 'Base URL of the Resource Repository API'
    required: true
  api-token:
    description: 'A ready-to-use bearer JWT. Mutually exclusive with client-id/client-secret/token-url. Pass via secrets — never hardcode.'
    required: false
  client-id:
    description: 'OIDC client ID for a client-credentials grant, exchanged for a bearer token before upload. Requires client-secret and token-url.'
    required: false
  client-secret:
    description: 'OIDC client secret. Pass via secrets — never hardcode.'
    required: false
  token-url:
    description: 'OIDC token endpoint to POST the client-credentials grant to (e.g. the Keycloak realm token endpoint).'
    required: false
  retries:
    description: 'Retry attempts for transient network/5xx failures'
    required: false
    default: '3'

outputs:
  resource-id:
    description: 'ID of the created resource'
    value: ${{ steps.upload.outputs.resource-id }}
  resource-version:
    description: 'Version of the created resource'
    value: ${{ steps.upload.outputs.resource-version }}
  response:
    description: 'Full JSON response body from the API'
    value: ${{ steps.upload.outputs.response }}

runs:
  using: composite
  steps:
    - id: upload
      shell: bash
      run: ${{ github.action_path }}/scripts/upload.sh
      env:
        FILE_PATH: ${{ inputs.file }}
        RESOURCE_TYPE: ${{ inputs.resource-type }}
        VERSION: ${{ inputs.version }}
        METADATA: ${{ inputs.metadata }}
        RELEASE_ACTION: ${{ inputs.release-action }}
        FLAG: ${{ inputs.flag }}
        PROVIDER: ${{ inputs.provider }}
        PROJECT: ${{ inputs.project }}
        API_BASE_URL: ${{ inputs.api-base-url }}
        API_TOKEN: ${{ inputs.api-token }}
        CLIENT_ID: ${{ inputs.client-id }}
        CLIENT_SECRET: ${{ inputs.client-secret }}
        TOKEN_URL: ${{ inputs.token-url }}
        RETRIES: ${{ inputs.retries }}
