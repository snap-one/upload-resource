name: integration
on:
  workflow_dispatch: {}
  push:
    branches: [main]

# Never add `pull_request` here: this repo is public, and GitHub withholds
# secrets from workflows triggered by a fork's pull_request. Real-API runs
# only happen on main / manual dispatch.

env:
  # Same default the action itself bakes in — repeated here because the
  # cleanup steps below call the API directly, not through the action.
  TOKEN_URL: https://identity.snapone.com/realms/ADI/protocol/openid-connect/token

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build a disposable test fixture
        run: echo "upload-resource smoke test ${{ github.run_id }}" > smoke-test.bin

      - name: Upload
        id: upload
        uses: ./
        with:
          file: smoke-test.bin
          # TODO: point at a resourceType created specifically for CI smoke tests
          # (see GET /api/v1/resource-types) — don't reuse `driver` or another
          # production type, it'll pollute real search/processing pipelines.
          resource-type: ${{ vars.RESOURCE_REPOSITORY_TEST_RESOURCE_TYPE }}
          version: "0.0.0-ci.${{ github.run_id }}"
          # TODO: point at stage, never prod.
          api-base-url: ${{ vars.RESOURCE_REPOSITORY_STAGE_URL }}
          # TODO: a client scoped resources:write + resources:delete against
          # stage — see docs/keycloak-requirements.md in resource-repository.
          # The delete scope is only needed for this test's own cleanup step.
          client-id: ${{ vars.RESOURCE_REPOSITORY_TEST_CLIENT_ID }}
          client-secret: ${{ secrets.RESOURCE_REPOSITORY_TEST_CLIENT_SECRET }}

      - name: Verify outputs
        run: |
          test -n "${{ steps.upload.outputs.resource-id }}"
          test -n "${{ steps.upload.outputs.resource-version }}"

      - name: Clean up the uploaded resource
        if: always() && steps.upload.outputs.resource-id != ''
        env:
          CLIENT_ID: ${{ vars.RESOURCE_REPOSITORY_TEST_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.RESOURCE_REPOSITORY_TEST_CLIENT_SECRET }}
        run: |
          token=$(curl -sS -f -d grant_type=client_credentials \
            -d "client_id=$CLIENT_ID" -d "client_secret=$CLIENT_SECRET" \
            "$TOKEN_URL" | jq -r .access_token)
          curl -sS -f -X DELETE -H "Authorization: Bearer $token" \
            "${{ vars.RESOURCE_REPOSITORY_STAGE_URL }}/api/v1/resources/${{ steps.upload.outputs.resource-id }}"

  smoke-test-feature-flag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build a disposable test fixture
        run: echo "upload-resource feature-flag smoke test ${{ github.run_id }}" > smoke-test-ff.bin

      - name: Upload gated behind a feature flag
        id: upload
        uses: ./
        with:
          file: smoke-test-ff.bin
          resource-type: ${{ vars.RESOURCE_REPOSITORY_TEST_RESOURCE_TYPE }}
          version: "0.0.0-ci.${{ github.run_id }}"
          release-action: feature_flag
          # TODO: a flag/provider/project already registered in stage's
          # FEATURE_FLAG_PROVIDERS config — see GET /api/v1/feature-flag-providers.
          flag: ${{ vars.RESOURCE_REPOSITORY_TEST_FLAG }}
          provider: ${{ vars.RESOURCE_REPOSITORY_TEST_PROVIDER }}
          project: ${{ vars.RESOURCE_REPOSITORY_TEST_PROJECT }}
          api-base-url: ${{ vars.RESOURCE_REPOSITORY_STAGE_URL }}
          client-id: ${{ vars.RESOURCE_REPOSITORY_TEST_CLIENT_ID }}
          client-secret: ${{ secrets.RESOURCE_REPOSITORY_TEST_CLIENT_SECRET }}

      - name: Verify outputs
        run: |
          test -n "${{ steps.upload.outputs.resource-id }}"
          test -n "${{ steps.upload.outputs.resource-version }}"

      - name: Clean up the uploaded resource
        if: always() && steps.upload.outputs.resource-id != ''
        env:
          CLIENT_ID: ${{ vars.RESOURCE_REPOSITORY_TEST_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.RESOURCE_REPOSITORY_TEST_CLIENT_SECRET }}
        run: |
          token=$(curl -sS -f -d grant_type=client_credentials \
            -d "client_id=$CLIENT_ID" -d "client_secret=$CLIENT_SECRET" \
            "$TOKEN_URL" | jq -r .access_token)
          curl -sS -f -X DELETE -H "Authorization: Bearer $token" \
            "${{ vars.RESOURCE_REPOSITORY_STAGE_URL }}/api/v1/resources/${{ steps.upload.outputs.resource-id }}"

  smoke-test-batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build two disposable test fixtures
        run: |
          mkdir batch
          echo "upload-resource batch smoke test 1 ${{ github.run_id }}" > batch/smoke-test-batch-1.bin
          echo "upload-resource batch smoke test 2 ${{ github.run_id }}" > batch/smoke-test-batch-2.bin

      - name: Upload both into one batch
        id: upload
        uses: ./
        with:
          file: batch/*.bin
          resource-type: ${{ vars.RESOURCE_REPOSITORY_TEST_RESOURCE_TYPE }}
          version: "0.0.0-ci.${{ github.run_id }}"
          # Its own batch rather than the daily default the other jobs share,
          # so the batch holds exactly these two files.
          batch-name: upload-resource-ci-${{ github.run_id }}-${{ github.run_attempt }}
          api-base-url: ${{ vars.RESOURCE_REPOSITORY_STAGE_URL }}
          client-id: ${{ vars.RESOURCE_REPOSITORY_TEST_CLIENT_ID }}
          client-secret: ${{ secrets.RESOURCE_REPOSITORY_TEST_CLIENT_SECRET }}

      - name: Verify the batch reports both files
        env:
          CLIENT_ID: ${{ vars.RESOURCE_REPOSITORY_TEST_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.RESOURCE_REPOSITORY_TEST_CLIENT_SECRET }}
          BATCH_ID: ${{ steps.upload.outputs.batch-id }}
          BATCH_NAME: ${{ steps.upload.outputs.batch-name }}
          RESOURCE_IDS: ${{ steps.upload.outputs.resource-ids }}
        run: |
          test "$BATCH_NAME" = "upload-resource-ci-${{ github.run_id }}-${{ github.run_attempt }}"
          test "$(jq length <<<"$RESOURCE_IDS")" = 2
          token=$(curl -sS -f -d grant_type=client_credentials \
            -d "client_id=$CLIENT_ID" -d "client_secret=$CLIENT_SECRET" \
            "$TOKEN_URL" | jq -r .access_token)
          curl -sS -f -H "Authorization: Bearer $token" \
            "${{ vars.RESOURCE_REPOSITORY_STAGE_URL }}/api/v1/batches/$BATCH_ID/resources" > batch.json
          jq -e --argjson ids "$RESOURCE_IDS" --arg name "$BATCH_NAME" '
            .batch.name == $name
            and (.batch.counts | add) == 2
            and ([.data[].id] | sort) == ($ids | sort)
          ' batch.json

      - name: Clean up the uploaded resources
        if: always() && steps.upload.outputs.resource-ids != ''
        env:
          CLIENT_ID: ${{ vars.RESOURCE_REPOSITORY_TEST_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.RESOURCE_REPOSITORY_TEST_CLIENT_SECRET }}
          RESOURCE_IDS: ${{ steps.upload.outputs.resource-ids }}
        run: |
          token=$(curl -sS -f -d grant_type=client_credentials \
            -d "client_id=$CLIENT_ID" -d "client_secret=$CLIENT_SECRET" \
            "$TOKEN_URL" | jq -r .access_token)
          for id in $(jq -r '.[]' <<<"$RESOURCE_IDS"); do
            curl -sS -f -X DELETE -H "Authorization: Bearer $token" \
              "${{ vars.RESOURCE_REPOSITORY_STAGE_URL }}/api/v1/resources/$id"
          done
