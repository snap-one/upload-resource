name: test
on: [push, pull_request]
jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: node test/upload_test.js

  windows-action-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Start mock servers
        shell: bash
        run: |
          rm -f .token-ready .resource-ready
          MOCK_STATUS=200 MOCK_BODY='{"access_token":"exchanged-token"}' MOCK_READY_FILE=.token-ready node test/mock_server.js 8892 >token-mock.log 2>&1 &
          MOCK_READY_FILE=.resource-ready node test/mock_server.js 8891 >resource-mock.log 2>&1 &
          for attempt in {1..40}; do
            if [[ -f .token-ready && -f .resource-ready ]]; then
              exit 0
            fi
            sleep 0.25
          done
          cat token-mock.log resource-mock.log
          exit 1

      - name: Run local action
        id: upload
        uses: ./
        with:
          # A wildcard exercises Windows path handling; it matches README.md only.
          file: "*.md"
          resource-type: test
          api-base-url: http://127.0.0.1:8891
          client-id: ci
          client-secret: test-secret
          token-url: http://127.0.0.1:8892
          retries: 1
      - name: Verify outputs
        shell: pwsh
        env:
          RESOURCE_ID: ${{ steps.upload.outputs.resource-id }}
          RESOURCE_VERSION: ${{ steps.upload.outputs.resource-version }}
          RESOURCE_IDS: ${{ steps.upload.outputs.resource-ids }}
          BATCH_ID: ${{ steps.upload.outputs.batch-id }}
          BATCH_NAME: ${{ steps.upload.outputs.batch-name }}
          SHA256: ${{ steps.upload.outputs.sha256 }}
        run: |
          if ($env:RESOURCE_ID -ne 'abc123') { throw "Unexpected resource ID: $env:RESOURCE_ID" }
          if ($env:RESOURCE_VERSION -ne '1.0.0') { throw "Unexpected resource version: $env:RESOURCE_VERSION" }
          if ($env:RESOURCE_IDS -ne '["abc123"]') { throw "Unexpected resource IDs: $env:RESOURCE_IDS" }
          if ($env:BATCH_ID -ne 'batch-123') { throw "Unexpected batch ID: $env:BATCH_ID" }
          if ($env:BATCH_NAME -notmatch '^upload-resource-\d{4}-\d{2}-\d{2}-test$') { throw "Unexpected batch name: $env:BATCH_NAME" }
          if ($env:SHA256 -ne (Get-FileHash README.md -Algorithm SHA256).Hash.ToLower()) { throw "Unexpected SHA-256: $env:SHA256" }
